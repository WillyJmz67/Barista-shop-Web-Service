{% extends "base.html" %}
{% block title %}Error en pago - Café & Barista Shop{% endblock %}
{% block content %}
<section class="section" style="padding-top:4rem;text-align:center;min-height:60vh">
    <div class="container">
        <div style="font-size:4rem;margin-bottom:1rem">❌</div>
        <h1 style="font-size:2rem;color:var(--color-primary);margin-bottom:0.5rem">Error en el pago</h1>
        <p style="color:var(--color-text-light);margin-bottom:2rem;font-size:1.1rem">
            El pago no pudo completarse. Puedes intentar de nuevo o contactarnos por WhatsApp.
        </p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
            <a href="/" class="btn btn-primary">Volver a la tienda</a>
            <a href="#" class="btn btn-whatsapp" id="errorWhatsApp">💬 Contactar</a>
        </div>
    </div>
</section>
{% endblock %}
